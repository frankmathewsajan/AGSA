version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: agsa_database_dev
    environment:
      POSTGRES_DB: agsa_db_dev
      POSTGRES_USER: agsa_user
      POSTGRES_PASSWORD: agsa_password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agsa_user -d agsa_db_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agsa_network_dev

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: agsa_redis_dev
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agsa_network_dev

  # Django Backend (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder  # Use a development target if we add one
    container_name: agsa_backend_dev
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-not-for-production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://agsa_user:agsa_password@database:5432/agsa_db_dev
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
    volumes:
      - ./backend:/app  # Mount source code for hot reload
      - media_files_dev:/app/media
    ports:
      - "8001:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run python manage.py runserver 0.0.0.0:8000
    networks:
      - agsa_network_dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  media_files_dev:
    driver: local

networks:
  agsa_network_dev:
    driver: bridge